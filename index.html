<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Matt &amp; Mia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="body--gate">

    <section class="gate" aria-label="Password gate">
        <div class="gate__inner">
            <p class="gate__eyebrow">Matt &amp; Mia</p>
            <h1 class="gate__monogram">M &amp; M</h1>
            <p class="gate__hint">Please enter the password from your invitation.</p>
            <form id="gate-form" class="gate__form" autocomplete="off">
                <label class="visually-hidden" for="gate-input">Password</label>
                <input
                    id="gate-input"
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    required
                />
                <button type="submit">Enter</button>
            </form>
            <p id="gate-error" class="gate__error" role="alert" aria-live="polite"></p>
        </div>
    </section>

    <script src="gate.js"></script>
</body>
</html>
