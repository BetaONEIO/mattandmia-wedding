<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Matt &amp; Mia</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="body--gate">

    <header class="hero hero--gate">
        <div class="hero__inner">
            <p class="hero__date">Saturday · 19 September 2026</p>
            <div class="wordmark" role="img" aria-label="Matt & Mia — Est. 2026">
                <span class="wordmark__row" aria-hidden="true">
                    <span class="wordmark__rule"></span>
                    <span class="wordmark__star"></span>
                    <span class="wordmark__rule"></span>
                </span>
                <span class="wordmark__names">MATT <span class="wordmark__amp">&amp;</span> MIA</span>
                <span class="wordmark__row" aria-hidden="true">
                    <span class="wordmark__rule"></span>
                    <span class="wordmark__est">EST. 2026</span>
                    <span class="wordmark__rule"></span>
                </span>
            </div>
            <p class="hero__location">Are getting married.</p>
        </div>
    </header>

    <section class="gate gate--below" aria-label="Password gate">
        <div class="gate__inner">
            <p class="gate__hint">Please enter the password from your invitation.</p>
            <form id="gate-form" class="gate__form" autocomplete="off">
                <label class="visually-hidden" for="gate-input">Password</label>
                <input
                    id="gate-input"
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocapitalize="off"
                    autocorrect="off"
                    spellcheck="false"
                    required
                />
                <button type="submit">Enter</button>
            </form>
            <p id="gate-error" class="gate__error" role="alert" aria-live="polite"></p>
        </div>
    </section>

    <script src="gate.js"></script>
</body>
</html>
